name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher and prebuilt installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Test installer failure and upgrade paths
        run: python3 -m unittest scripts/test_install.py

      - name: Lint, vet, and test launcher
        run: make launcher-check

  agent:
    name: Agent + web UI (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            agent/web-ui/package-lock.json

      - name: Install agent dependencies
        run: npm ci --prefix agent

      - name: Install web UI dependencies
        run: npm ci --prefix agent/web-ui

      - name: Check agent and web UI
        run: make agent-check

  daemon:
    name: Go daemon (lint, vet, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Install daemon test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check daemon
        run: make daemon-check

  core:
    name: C core (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libpq-dev

      - name: Lint C function sizes
        run: make core-lint

      # Upstream microsoft/onnxruntime-extensions was removed from GitHub.
      # It is only built when ONNX Runtime is installed, which CI does not do.
      - name: Fetch tree-sitter grammars
        run: |
          git config submodule.core/third_party/onnxruntime-extensions.update none
          make submodules

      - name: Build
        run: make build-core

      - name: Test
        run: make test

  index-providers:
    name: Index provider integration (usearch + qdrant + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codeberg
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libpq-dev postgresql-client

      # Upstream microsoft/onnxruntime-extensions was removed from GitHub.
      # It is only built when ONNX Runtime is installed, which CI does not do.
      - name: Fetch tree-sitter grammars
        run: |
          git config submodule.core/third_party/onnxruntime-extensions.update none
          make submodules

      - name: Build
        run: make build-core

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 1
          done
          exit 1

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d codeberg && exit 0
            sleep 1
          done
          exit 1

      - name: Test index providers
        env:
          CBERG_TEST_QDRANT_URL: http://127.0.0.1:6333
          CBERG_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/codeberg
        run: ./core/build/test/test_index_providers
